<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Control Panel</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121214;
            color: #e1e1e6;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h2 {
            margin-bottom: 20px;
            font-weight: 600;
            letter-spacing: 1px;
            color: #00e676;
            text-transform: uppercase;
            font-size: 1.2rem;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            width: 100%;
            max-width: 400px;
        }

        .btn {
            background-color: #202024;
            border: 2px solid #29292e;
            color: #e1e1e6;
            padding: 15px 10px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            text-transform: uppercase;
        }

        .btn:hover {
            background-color: #29292e;
            border-color: #00e676;
            color: #fff;
            box-shadow: 0 0 10px rgba(0, 230, 118, 0.2);
        }

        .btn:active {
            transform: scale(0.95);
        }

        /* Warna khusus untuk Wiped Out agar kontras */
        .btn-alert {
            grid-column: span 2;
            background-color: #f44336;
            border-color: #d32f2f;
        }
        .btn-alert:hover {
            background-color: #d32f2f;
            border-color: #ff7961;
            box-shadow: 0 0 10px rgba(244, 67, 54, 0.4);
        }
    </style>
</head>
<body>

    <h2>Kill Notification Trigger</h2>
    
    <div class="grid-container">
        <button class="btn" onclick="triggerAlert('first_blood')">First Blood</button>
        <button class="btn" onclick="triggerAlert('double_kill')">Double Kill</button>
        <button class="btn" onclick="triggerAlert('triple_kill')">Triple Kill</button>
        <button class="btn" onclick="triggerAlert('maniac')">Maniac</button>
        <button class="btn" onclick="triggerAlert('savage')">Savage</button>
        <button class="btn btn-alert" onclick="triggerAlert('wiped_out')">Wiped Out</button>
    </div>

    <script>
        // Inisialisasi channel komunikasi
        const bc = new BroadcastChannel('obs_alerts');

        function triggerAlert(alertType) {
            // Mengirimkan tipe alert ke file overlay
            bc.postMessage({ action: 'play', type: alertType });
        }
    </script>
</body>
</html>
