<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>MLBB Master Control Panel</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #121214; color: #fff; padding: 15px; text-align: center; margin: 0; }
        h1 { color: #f3a83b; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 2px; font-size: 20px; }
        .wrapper { max-width: 500px; margin: 0 auto; display: flex; flex-direction: column; gap: 15px; }
        .section { background: #1a1a1e; border: 1px solid #29292e; padding: 15px; border-radius: 8px; }
        h2 { font-size: 14px; color: #aaa; margin-top: 0; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px; }
        .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        button { padding: 14px; font-size: 13px; font-weight: bold; border: none; border-radius: 5px; cursor: pointer; transition: all 0.15s ease; text-transform: uppercase; }
        button:active { transform: scale(0.96); }
        .btn-spawn { background: #d35400; color: #fff; }
        .btn-blue { background: #2471a3; color: #fff; }
        .btn-red { background: #922b21; color: #fff; }
        .btn-kill { background: #d4ac0d; color: #121214; border-bottom: 3px solid #9a7d0a; }
        .btn-kill:hover { background: #f4d03f; }
    </style>
</head>
<body>

    <h1>MLBB All-in-One Control</h1>

    <div class="wrapper">
        <!-- KONTROL MONSTER -->
        <div class="section" style="border-top: 4px solid #d35400;">
            <h2>Objective Respawns</h2>
            <div style="display: flex; flex-direction: column; gap: 10px;">
                <div class="grid-2">
                    <button class="btn-blue" onclick="send('monster', 'turtle', 'blue')">Blue Turtle</button>
                    <button class="btn-red" onclick="send('monster', 'turtle', 'red')">Red Turtle</button>
                </div>
                <div class="grid-2">
                    <button class="btn-blue" onclick="send('monster', 'lord', 'blue')">Blue Lord</button>
                    <button class="btn-red" onclick="send('monster', 'lord', 'red')">Red Lord</button>
                </div>
                <div class="grid-2">
                    <button class="btn-spawn" onclick="send('monster', 'turtle')">Spawn Turtle 🐢</button>
                    <button class="btn-spawn" onclick="send('monster', 'lord')">Spawn Lord ⚔️</button>
                </div>
            </div>
        </div>

        <!-- KONTROL KILL SLAYER -->
        <div class="section" style="border-top: 4px solid #d4ac0d;">
            <h2>Kill Slayer Alerts</h2>
            <div class="grid-2">
                <button class="btn-kill" onclick="send('kill', 'first_blood')">First Blood</button>
                <button class="btn-kill" onclick="send('kill', 'double_kill')">Double Kill</button>
                <button class="btn-kill" onclick="send('kill', 'triple_kill')">Triple Kill</button>
                <button class="btn-kill" onclick="send('kill', 'maniac')">Maniac</button>
                <button class="btn-kill" onclick="send('kill', 'savage')">Savage</button>
                <button class="btn-kill" onclick="send('kill', 'wiped_out')">Wiped Out</button>
            </div>
        </div>
    </div>

    <script>
        function send(type, eventName, team = null) {
            const payload = { type, event: eventName, team, timestamp: Date.now() };
            localStorage.setItem('mlbb_master_action', JSON.stringify(payload));
        }
    </script>
</body>
</html>
