<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MLBB Automated Draft Pick Overlay</title>
    <style>
        :root {
            --blue-color: #00d2ff;
            --blue-glow: rgba(0, 210, 255, 0.4);
            --red-color: #ff414d;
            --red-glow: rgba(255, 65, 77, 0.4);
            --dark-overlay: rgba(10, 10, 12, 0.9);
        }

        body {
            margin: 0; padding: 0;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            color: #fff; overflow-x: hidden; background-color: #0c0c0e;
        }

        /* ==========================================================================
           BACKGROUND MODES
           ========================================================================== */
        body.demo-mode {
            background: linear-gradient(-45deg, #0f172a, #1e1b4b, #2e1065, #0f172a);
            background-size: 400% 400%; animation: gradientBG 15s ease infinite;
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; }
        }

        #bg-video { position: fixed; right: 0; bottom: 0; min-width: 100%; min-height: 100%; z-index: -100; object-fit: cover; display: none; }
        body.video-mode #bg-video { display: block; }

        /* WIDGET KONTROL SIMULASI (Floating) */
        .admin-widgets { position: fixed; top: 10px; right: 10px; z-index: 9999; display: flex; gap: 8px; }
        .widget-btn {
            background: rgba(0,0,0,0.8); border: 1px solid #f3a83b; padding: 6px 12px; 
            border-radius: 20px; font-size: 11px; cursor: pointer; color: #f3a83b; font-weight: bold; text-transform: uppercase;
        }
        .widget-btn:hover { background: #f3a83b; color: #000; }

        /* ==========================================================================
           LAYOUT UTAMA & RESPONSIVE CSS
           ========================================================================== */
        .overlay-container { max-width: 1280px; margin: 0 auto; padding: 20px; box-sizing: border-box; display: grid; grid-template-columns: 1fr; gap: 20px; }

        .header-vs {
            display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
            background: var(--dark-overlay); border-radius: 12px; padding: 15px; border: 1px solid #2d2d35; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .team-capsule { display: flex; align-items: center; gap: 15px; }
        .team-capsule.blue { color: var(--blue-color); }
        .team-capsule.red { color: var(--red-color); justify-content: flex-end; text-align: right; }
        .team-logo { width: 50px; height: 50px; object-fit: contain; }
        .team-name { font-size: 20px; font-weight: 800; text-transform: uppercase; }

        /* TIMER BROADCAST SYSTEM */
        .vs-box {
            text-align: center; font-weight: bold; padding: 0 20px;
            border-left: 2px solid #444; border-right: 2px solid #444;
            display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 130px;
        }
        .phase-text { font-size: 9px; color: #aaa; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 2px; text-align: center; }
        .countdown-clock { font-size: 28px; font-weight: 900; color: #f3a83b; transition: all 0.2s; }
        
        /* State Warna Timer Sesuai Giliran Aktif */
        .vs-box.active-blue { border-left: 4px solid var(--blue-color); }
        .vs-box.active-blue .countdown-clock { color: var(--blue-color); text-shadow: 0 0 10px var(--blue-color); }
        .vs-box.active-red { border-right: 4px solid var(--red-color); }
        .vs-box.active-red .countdown-clock { color: var(--red-color); text-shadow: 0 0 10px var(--red-color); }
        
        .countdown-clock.danger { color: #ff3838 !important; animation: pulseBlink 0.5s infinite alternate; }
        @keyframes pulseBlink { 0% { opacity: 1; transform: scale(1); } 100% { opacity: 0.5; transform: scale(1.08); } }

        /* CARDS BOARD DRAFT */
        .draft-board { display: grid; grid-template-columns: 1fr; gap: 20px; }
        .picks-column { display: flex; flex-direction: column; gap: 10px; }
        
        .pick-card {
            display: flex; align-items: center; background: var(--dark-overlay); border-radius: 8px; padding: 10px 15px;
            position: relative; overflow: hidden; border: 1px solid #232329; transition: all 0.3s ease;
        }
        .picks-column.blue-side .pick-card { border-left: 5px solid var(--blue-color); }
        .picks-column.red-side .pick-card { border-right: 5px solid var(--red-color); flex-direction: row-reverse; text-align: right; }

        /* Efek Berkedip Menandakan Slot yang Sedang Memilih */
        .pick-card.current-selecting {
            animation: slotGlow 1s infinite alternate;
            background: rgba(255,255,255,0.03);
        }
        @keyframes slotGlow {
            0% { border-color: #333; box-shadow: 0 0 5px rgba(255,255,255,0.1); }
            100% { 
                border-color: currentColor; 
                box-shadow: 0 0 15px currentColor;
            }
        }

        .player-info { flex-grow: 1; z-index: 2; }
        .p-name { font-size: 11px; color: #aaa; text-transform: uppercase; font-weight: 600; }
        .h-name { font-size: 18px; font-weight: 700; margin-top: 2px; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
        
        /* BANS SECTION */
        .bans-container { background: var(--dark-overlay); border-radius: 12px; padding: 15px; display: flex; flex-direction: column; gap: 15px; border: 1px solid #2d2d35; }
        .ban-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        .ban-row.red-ban-row { flex-direction: row-reverse; }
        .ban-label { font-size: 11px; font-weight: bold; color: #666; text-transform: uppercase; }
        .ban-slots { display: flex; gap: 8px; }
        
        .ban-item { 
            background: #1c1c22; border: 1px solid #3a3a45; padding: 8px 12px; font-size: 12px; 
            font-weight: bold; border-radius: 4px; min-width: 60px; text-align: center; text-transform: uppercase; color: #ddd;
            transition: all 0.3s;
        }
        .blue-side .ban-item { border-bottom: 2px solid var(--blue-color); }
        .red-side .ban-item { border-bottom: 2px solid var(--red-color); }
        
        .ban-item.current-selecting { animation: slotGlow 0.8s infinite alternate; background: #2c2c35; }

        /* WIDESCREEN DESKTOP */
        @media (min-width: 768px) {
            .overlay-container { height: 100vh; grid-template-rows: auto 1fr auto; padding: 30px; }
            .draft-board { grid-template-columns: 1fr 1fr; gap: 40px; align-content: center; }
            .team-logo { width: 70px; height: 70px; } .team-name { font-size: 28px; }
            .vs-box { padding: 0 40px; min-width: 180px; } .phase-text { font-size: 11px; } .countdown-clock { font-size: 46px; }
            .pick-card { padding: 18px 25px; } .p-name { font-size: 13px; } .h-name { font-size: 24px; }
            .bans-container { grid-template-columns: 1fr 1fr; display: grid; gap: 40px; }
            .ban-item { min-width: 80px; padding: 10px 15px; font-size: 13px; }
        }
    </style>
</head>
<body class="demo-mode">

    <!-- VIDEO BACKGROUND -->
    <video autoplay muted loop playsinline id="bg-video">
        <source src="https://assets.mixkit.co/videos/preview/mixkit-abstract-laser-lights-background-27739-large.mp4" type="video/mp4">
    </video>

    <!-- FLOATING SIMULATION CONTROLLER -->
    <div class="admin-widgets">
        <button class="widget-btn" onclick="toggleBackgroundMode()">🎬 Demo/Video</button>
        <button class="widget-btn" id="speed-btn" onclick="toggleSpeedMode()">⚡ Speed: Normal (30s)</button>
        <button class="widget-btn" onclick="resetSimulation()">🔄 Restart Draft</button>
    </div>

    <div class="overlay-container">
        <!-- TOP ROW: TEAMS & CLOCK -->
        <div class="header-vs">
            <div class="team-capsule blue">
                <img class="team-logo" src="https://via.placeholder.com/150/00d2ff/ffffff?text=EVOS" alt="Logo">
                <div class="team-name">Evos Glory</div>
            </div>
            
            <div class="vs-box" id="timer-box">
                <div id="phase-label" class="phase-text">-</div>
                <div id="countdown-clock" class="countdown-clock">-</div>
            </div>

            <div class="team-capsule red">
                <div class="team-name">RRQ Hoshi</div>
                <img class="team-logo" src="https://via.placeholder.com/150/ff414d/ffffff?text=RRQ" alt="Logo">
            </div>
        </div>

        <!-- MIDDLE ROW: HERO PICKS -->
        <div class="draft-board">
            <!-- Sisi Biru -->
            <div class="picks-column blue-side">
                <div id="blue_card1" class="pick-card"><div class="player-info"><div class="p-name">Fluffy</div><div id="blue_pick1" class="h-name">-</div></div></div>
                <div id="blue_card2" class="pick-card"><div class="player-info"><div class="p-name">Anavel</div><div id="blue_pick2" class="h-name">-</div></div></div>
                <div id="blue_card3" class="pick-card"><div class="player-info"><div class="p-name">Claw Jr</div><div id="blue_pick3" class="h-name">-</div></div></div>
                <div id="blue_card4" class="pick-card"><div class="player-info"><div class="p-name">Branz</div><div id="blue_pick4" class="h-name">-</div></div></div>
                <div id="blue_card5" class="pick-card"><div class="player-info"><div class="p-name">Dreams</div><div id="blue_pick5" class="h-name">-</div></div></div>
            </div>
            <!-- Sisi Merah -->
            <div class="picks-column red-side">
                <div id="red_card1" class="pick-card"><div class="player-info"><div class="p-name">Dyrennn</div><div id="red_pick1" class="h-name">-</div></div></div>
                <div id="red_card2" class="pick-card"><div class="player-info"><div class="p-name">Sutsujin</div><div id="red_pick2" class="h-name">-</div></div></div>
                <div id="red_card3" class="pick-card"><div class="player-info"><div class="p-name">Clayyy</div><div id="red_pick3" class="h-name">-</div></div></div>
                <div id="red_card4" class="pick-card"><div class="player-info"><div class="p-name">Skylar</div><div id="red_pick4" class="h-name">-</div></div></div>
                <div id="red_card5" class="pick-card"><div class="player-info"><div class="p-name">Idok</div><div id="red_pick5" class="h-name">-</div></div></div>
            </div>
        </div>

        <!-- BOTTOM ROW: BANS -->
        <div class="bans-container">
            <div class="ban-row blue-side">
                <div class="ban-label">Banned</div>
                <div class="ban-slots">
                    <div id="blue_ban1" class="ban-item">-</div>
                    <div id="blue_ban2" class="ban-item">-</div>
                    <div id="blue_ban3" class="ban-item">-</div>
                    <div id="blue_ban4" class="ban-item">-</div>
                    <div id="blue_ban5" class="ban-item">-</div>
                </div>
            </div>
            <div class="ban-row red-side red-ban-row">
                <div class="ban-label">Banned</div>
                <div class="ban-slots">
                    <div id="red_ban1" class="ban-item">-</div>
                    <div id="red_ban2" class="ban-item">-</div>
                    <div id="red_ban3" class="ban-item">-</div>
                    <div id="red_ban4" class="ban-item">-</div>
                    <div id="red_ban5" class="ban-item">-</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Urutan regulasi resmi turnamen (Dimulai dari Tim Biru)
        const draftSequence = [
            { side: 'blue', type: 'ban', slot: 1, hero: 'Nolan', phase: 'Phase 1 Ban' },
            { side: 'red',  type: 'ban', slot: 1, hero: 'Tigreal', phase: 'Phase 1 Ban' },
            { side: 'blue', type: 'ban', slot: 2, hero: 'Diggie', phase: 'Phase 1 Ban' },
            { side: 'red',  type: 'ban', slot: 2, hero: 'Mathilda', phase: 'Phase 1 Ban' },
            { side: 'blue', type: 'ban', slot: 3, hero: 'Joy', phase: 'Phase 1 Ban' },
            { side: 'red',  type: 'ban', slot: 3, hero: 'Faramis', phase: 'Phase 1 Ban' },
            
            { side: 'blue', type: 'pick', slot: 1, hero: 'Harith', phase: 'Phase 1 Pick' },
            { side: 'red',  type: 'pick', slot: 1, hero: 'Ruby', phase: 'Phase 1 Pick' },
            { side: 'red',  type: 'pick', slot: 2, hero: 'Fredrinn', phase: 'Phase 1 Pick' },
            { side: 'blue', type: 'pick', slot: 2, hero: 'Valentina', phase: 'Phase 1 Pick' },
            { side: 'blue', type: 'pick', slot: 3, hero: 'Terizla', phase: 'Phase 1 Pick' },
            { side: 'red',  type: 'pick', slot: 3, hero: 'Claude', phase: 'Phase 1 Pick' },
            
            { side: 'red',  type: 'ban', slot: 4, hero: 'Angela', phase: 'Phase 2 Ban' },
            { side: 'blue', type: 'ban', slot: 4, hero: 'Kaja', phase: 'Phase 2 Ban' },
            { side: 'red',  type: 'ban', slot: 5, hero: 'Edith', phase: 'Phase 2 Ban' },
            { side: 'blue', type: 'ban', slot: 5, hero: 'Minotaur', phase: 'Phase 2 Ban' },
            
            { side: 'red',  type: 'pick', slot: 4, hero: 'Roger', phase: 'Phase 2 Pick' },
            { side: 'blue', type: 'pick', slot: 4, hero: 'Karrie', phase: 'Phase 2 Pick' },
            { side: 'blue', type: 'pick', slot: 5, hero: 'Baxia', phase: 'Phase 2 Pick' },
            { side: 'red',  type: 'pick', slot: 5, hero: 'Arlott', phase: 'Phase 2 Pick' }
        ];

        let currentStep = 0;
        let maxTime = 30; 
        let secondsLeft = maxTime;
        let coreTicker = null;

        function startSimulationEngine() {
            clearInterval(coreTicker);
            
            // Eksekusi visualisasi awal INSTAN di detik ke-0 (Langsung Biru)
            updateVisuals(draftSequence[currentStep]);

            coreTicker = setInterval(() => {
                secondsLeft--;

                if (secondsLeft < 0) {
                    // Waktu habis -> Kunci hero saat ini, lalu naikkan step
                    lockHero(draftSequence[currentStep]);
                    currentStep++;
                    secondsLeft = maxTime;

                    // Periksa apakah seluruh draf sudah selesai
                    if (currentStep >= draftSequence.length) {
                        clearInterval(coreTicker);
                        document.getElementById('phase-label').innerText = "DRAFT COMPLETED";
                        document.getElementById('countdown-clock').innerText = "DONE";
                        document.getElementById('countdown-clock').className = "countdown-clock";
                        removeActiveHighlights();
                        return;
                    }
                }

                // Update visual detak jam dan status slot aktif
                updateVisuals(draftSequence[currentStep]);
            }, 1000);
        }

        function updateVisuals(phase) {
            const timerBox = document.getElementById('timer-box');
            const clock = document.getElementById('countdown-clock');
            const label = document.getElementById('phase-label');

            clock.innerText = secondsLeft;
            label.innerText = `${phase.phase} - ${phase.side.toUpperCase()}`;

            // Ganti warna pembatas tengah sesuai tim yang aktif
            timerBox.className = "vs-box";
            if(phase.side === 'blue') timerBox.classList.add('active-blue');
            if(phase.side === 'red') timerBox.classList.add('active-red');

            // Alarm Merah Berkedip saat kritis <= 5 detik
            if (secondsLeft <= 5) {
                clock.classList.add('danger');
            } else {
                clock.classList.remove('danger');
            }

            // Berikan efek bersinar (glowing) pada slot board yang bersangkutan
            removeActiveHighlights();
            let targetDOMId = `${phase.side}_${phase.type}${phase.slot}`;
            if(phase.type === 'pick') targetDOMId = `${phase.side}_card${phase.slot}`;
            
            const targetEl = document.getElementById(targetDOMId);
            if(targetEl) targetEl.classList.add('current-selecting');
        }

        function lockHero(phase) {
            const targetDOMId = `${phase.side}_${phase.type}${phase.slot}`;
            const targetEl = document.getElementById(targetDOMId);
            if(targetEl) {
                targetEl.innerText = phase.hero;
            }
        }

        function removeActiveHighlights() {
            document.querySelectorAll('.pick-card, .ban-item').forEach(el => {
                el.classList.remove('current-selecting');
            });
        }

        function resetSimulation() {
            currentStep = 0;
            secondsLeft = maxTime;
            document.querySelectorAll('.h-name').forEach(el => el.innerText = '-');
            document.querySelectorAll('.ban-item').forEach(el => el.innerText = '-');
            startSimulationEngine();
        }

        function toggleSpeedMode() {
            const btn = document.getElementById('speed-btn');
            if (maxTime === 30) {
                maxTime = 3; 
                btn.innerText = "⚡ Speed: Fast (3s)";
            } else {
                maxTime = 30; 
                btn.innerText = "⚡ Speed: Normal (30s)";
            }
            secondsLeft = Math.min(secondsLeft, maxTime);
            updateVisuals(draftSequence[currentStep]);
        }

        function toggleBackgroundMode() {
            const body = document.body;
            if (body.classList.contains('demo-mode')) {
                body.classList.remove('demo-mode'); body.classList.add('video-mode');
            } else {
                body.classList.remove('video-mode'); body.classList.add('demo-mode');
            }
        }

        window.onload = startSimulationEngine;
    </script>
</body>
</html>
