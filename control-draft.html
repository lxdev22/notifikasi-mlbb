<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MLBB Draft Pick Control Panel (Strict Search)</title>
    <style>
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: #121214; 
            color: #fff; 
            padding: 15px; 
            margin: 0; 
        }
        h1 { 
            color: #f3a83b; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            font-size: 20px; 
            margin-bottom: 20px; 
            text-align: center; 
        }
        
        .container { 
            max-width: 1100px; 
            margin: 0 auto; 
            display: flex;
            flex-direction: column;
            gap: 20px; 
        }
        
        .section { 
            background: #1a1a1e; 
            border: 1px solid #29292e; 
            padding: 15px; 
            border-radius: 8px; 
            box-sizing: border-box;
        }
        .blue-section { border-top: 4px solid #2980b9; }
        .red-section { border-top: 4px solid #c0392b; }
        
        h2 { 
            font-size: 15px; 
            margin-top: 0; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
            margin-bottom: 15px; 
            color: #aaa; 
        }
        
        .form-group { 
            margin-bottom: 12px; 
            display: flex; 
            flex-direction: column; 
            gap: 5px; 
        }
        label { 
            font-size: 11px; 
            color: #888; 
            text-transform: uppercase; 
            font-weight: bold; 
        }
        
        input[type="text"], input[type="file"] { 
            padding: 12px 10px; 
            background: #2c2c35; 
            border: 1px solid #444; 
            color: #fff; 
            border-radius: 4px; 
            font-size: 14px; 
            box-sizing: border-box;
            width: 100%;
        }
        input[type="file"] { padding: 8px; font-size: 12px; cursor: pointer; }
        input:focus { border-color: #f3a83b; outline: none; }
        
        .logo-upload-wrapper { display: flex; align-items: center; gap: 10px; }
        .img-preview { width: 45px; height: 45px; object-fit: contain; background: #121214; border: 1px solid #444; border-radius: 4px; display: none; }
        
        .grid-5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
        .slot-title { font-size: 9px; text-align: center; color: #bbb; margin-bottom: 3px; font-weight: bold; }
        
        .grid-5 input { padding: 10px 3px; font-size: 11px; text-align: center; }
        .status-bar { text-align: center; font-size: 12px; color: #2ecc71; margin-bottom: 15px; font-style: italic; }

        /* ==========================================================================
           CSS UNTUK CUSTOM DROPDOWN STRICT SEARCH
           ========================================================================== */
        .dropdown-container {
            position: relative;
            width: 100%;
        }
        .dropdown-menu {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: #25252d;
            border: 1px solid #f3a83b;
            max-height: 180px;
            overflow-y: auto;
            z-index: 9999;
            border-radius: 0 0 6px 6px;
            display: none;
            box-shadow: 0 8px 16px rgba(0,0,0,0.6);
        }
        .dropdown-item {
            padding: 12px 10px;
            cursor: pointer;
            font-size: 13px;
            border-bottom: 1px solid #32323d;
            text-align: left;
            color: #fff;
        }
        .dropdown-item:hover {
            background: #f3a83b;
            color: #121214;
            font-weight: bold;
        }

        /* DESKTOP LAYOUT (> 768px) */
        @media (min-width: 768px) {
            body { padding: 25px; }
            h1 { font-size: 24px; }
            .container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
            .grid-5 { gap: 8px; }
            .grid-5 input { padding: 12px 10px; font-size: 13px; text-align: left; }
            label { font-size: 12px; }
        }
    </style>
</head>
<body>

    <h1>MLBB Tournament Draft Controller</h1>
    <div class="status-bar">⚡ Live Auto-Sync & Strict Search Dropdown Aktif</div>

    <div class="container">
        
        <!-- TIM BIRU -->
        <div class="section blue-section">
            <h2>Blue Team Setup</h2>
            <div class="form-group">
                <label>Nama Tim</label>
                <input type="text" id="blue_name" value="Evos Glory">
            </div>
            <div class="form-group">
                <label>Upload Logo Tim Biru</label>
                <div class="logo-upload-wrapper">
                    <input type="file" id="blue_logo" accept="image/*" onchange="processLogo(this, 'blue')">
                    <img id="blue_preview" class="img-preview" src="" alt="Preview">
                </div>
            </div>
            
            <label style="display:block; margin: 15px 0 5px 0;">Nama Player (1 - 5)</label>
            <div class="form-group"><input type="text" id="blue_p1" value="Player 1"></div>
            <div class="form-group"><input type="text" id="blue_p2" value="Player 2"></div>
            <div class="form-group"><input type="text" id="blue_p3" value="Player 3"></div>
            <div class="form-group"><input type="text" id="blue_p4" value="Player 4"></div>
            <div class="form-group"><input type="text" id="blue_p5" value="Player 5"></div>

            <label style="display:block; margin: 15px 0 5px 0;">Hero Banned (1 - 5)</label>
            <div class="grid-5">
                <div><div class="slot-title">B1</div><div class="dropdown-container"><input type="text" id="blue_ban1" class="hero-input" placeholder="Hero"></div></div>
                <div><div class="slot-title">B2</div><div class="dropdown-container"><input type="text" id="blue_ban2" class="hero-input" placeholder="Hero"></div></div>
                <div><div class="slot-title">B3</div><div class="dropdown-container"><input type="text" id="blue_ban3" class="hero-input" placeholder="Hero"></div></div>
                <div><div class="slot-title">B4</div><div class="dropdown-container"><input type="text" id="blue_ban4" class="hero-input" placeholder="Hero"></div></div>
                <div><div class="slot-title">B5</div><div class="dropdown-container"><input type="text" id="blue_ban5" class="hero-input" placeholder="Hero"></div></div>
            </div>

            <label style="display:block; margin: 15px 0 5px 0;">Hero Picks (Player 1 - 5)</label>
            <div style="display:flex; flex-direction:column; gap: 8px;">
                <div class="dropdown-container"><input type="text" id="blue_pick1" class="hero-input" placeholder="Pick untuk Player 1..."></div>
                <div class="dropdown-container"><input type="text" id="blue_pick2" class="hero-input" placeholder="Pick untuk Player 2..."></div>
                <div class="dropdown-container"><input type="text" id="blue_pick3" class="hero-input" placeholder="Pick untuk Player 3..."></div>
                <div class="dropdown-container"><input type="text" id="blue_pick4" class="hero-input" placeholder="Pick untuk Player 4..."></div>
                <div class="dropdown-container"><input type="text" id="blue_pick5" class="hero-input" placeholder="Pick untuk Player 5..."></div>
            </div>
        </div>

        <!-- TIM MERAH -->
        <div class="section red-section">
            <h2>Red Team Setup</h2>
            <div class="form-group">
                <label>Nama Tim</label>
                <input type="text" id="red_name" value="RRQ Hoshi">
            </div>
            <div class="form-group">
                <label>Upload Logo Tim Merah</label>
                <div class="logo-upload-wrapper">
                    <input type="file" id="red_logo" accept="image/*" onchange="processLogo(this, 'red')">
                    <img id="red_preview" class="img-preview" src="" alt="Preview">
                </div>
            </div>
            
            <label style="display:block; margin: 15px 0 5px 0;">Nama Player (1 - 5)</label>
            <div class="form-group"><input type="text" id="red_p1" value="Player 1"></div>
            <div class="form-group"><input type="text" id="red_p2" value="Player 2"></div>
            <div class="form-group"><input type="text" id="red_p3" value="Player 3"></div>
            <div class="form-group"><input type="text" id="red_p4" value="Player 4"></div>
            <div class="form-group"><input type="text" id="red_p5" value="Player 5"></div>

            <label style="display:block; margin: 15px 0 5px 0;">Hero Banned (1 - 5)</label>
            <div class="grid-5">
                <div><div class="slot-title">B1</div><div class="dropdown-container"><input type="text" id="red_ban1" class="hero-input" placeholder="Hero"></div></div>
                <div><div class="slot-title">B2</div><div class="dropdown-container"><input type="text" id="red_ban2" class="hero-input" placeholder="Hero"></div></div>
                <div><div class="slot-title">B3</div><div class="dropdown-container"><input type="text" id="red_ban3" class="hero-input" placeholder="Hero"></div></div>
                <div><div class="slot-title">B4</div><div class="dropdown-container"><input type="text" id="red_ban4" class="hero-input" placeholder="Hero"></div></div>
                <div><div class="slot-title">B5</div><div class="dropdown-container"><input type="text" id="red_ban5" class="hero-input" placeholder="Hero"></div></div>
            </div>

            <label style="display:block; margin: 15px 0 5px 0;">Hero Picks (Player 1 - 5)</label>
            <div style="display:flex; flex-direction:column; gap: 8px;">
                <div class="dropdown-container"><input type="text" id="red_pick1" class="hero-input" placeholder="Pick untuk Player 1..."></div>
                <div class="dropdown-container"><input type="text" id="red_pick2" class="hero-input" placeholder="Pick untuk Player 2..."></div>
                <div class="dropdown-container"><input type="text" id="red_pick3" class="hero-input" placeholder="Pick untuk Player 3..."></div>
                <div class="dropdown-container"><input type="text" id="red_pick4" class="hero-input" placeholder="Pick untuk Player 4..."></div>
                <div class="dropdown-container"><input type="text" id="red_pick5" class="hero-input" placeholder="Pick untuk Player 5..."></div>
            </div>
        </div>

    </div>

    <script>
        // Database Hero MLBB di Javascript
        const mlbbHeroes = [
            "Miya", "Balmond", "Saber", "Alice", "Nana", "Tigreal", "Alucard", "Karina", "Akai", "Franco",
            "Bane", "Bruno", "Clint", "Rafaela", "Eudora", "Zilong", "Fanny", "Layla", "Minotaur", "Lolita",
            "Hayabusa", "Freya", "Gord", "Natalia", "Kagura", "Chou", "Sun", "Alpha", "Ruby", "Yi Sun-shin",
            "Moskov", "Johnson", "Cyclops", "Estes", "Hylos", "Chang'e", "Selena", "Gusion", "Valir", "Martis",
            "Uranus", "Hanabi", "Lunox", "Claude", "Vale", "Karrie", "Helcurt", "Pharsa", "Lesley", "Jawhead",
            "Angela", "Lancelot", "Odette", "Argus", "Khufra", "Esmeralda", "Guinevere", "Granger", "X.Borg", "Dyrroth",
            "Lylia", "Baxia", "Masha", "Wanwan", "Silvanna", "Carmilla", "Cecilion", "Atlas", "Popol and Kupa", "Yu Zhong",
            "Khaleed", "Barats", "Brody", "Benedetta", "Mathilda", "Paquito", "Yve", "Beatrix", "Gloo", "Phoveus",
            "Natan", "Aulus", "Aamon", "Valentina", "Edith", "Yin", "Melissa", "Xavier", "Julian", "Fredrinn",
            "Joy", "Arlott", "Novaria", "Ixia", "Nolan", "Cici", "Chip", "Zhuxin", "Suyou", "Lukas",
            "Gatotkaca", "Grock", "Harley", "Irithel", "Vexana", "Aurora", "Lapu-Lapu", "Hilda", "Roger", "Kadita",
            "Badang", "Minsitthar", "Thamuz", "Harith", "Hanzo", "Belerick", "Kimmy", "Terizla", "Ling", "Floryn"
        ].sort();

        let blueLogoBase64 = "logos/blue_team.png";
        let redLogoBase64 = "logos/red_team.png";

        function processLogo(input, team) {
            const file = input.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const base64Result = e.target.result;
                    if (team === 'blue') blueLogoBase64 = base64Result;
                    if (team === 'red') redLogoBase64 = base64Result;
                    
                    const previewImg = document.getElementById(`${team}_preview`);
                    previewImg.src = base64Result;
                    previewImg.style.display = "block";
                    
                    syncDraft();
                };
                reader.readAsDataURL(file);
            }
        }

        function syncDraft() {
            const getVal = (id) => document.getElementById(id).value;
            
            const draftData = {
                blue: {
                    name: getVal('blue_name'), logo: blueLogoBase64,
                    players: [getVal('blue_p1'), getVal('blue_p2'), getVal('blue_p3'), getVal('blue_p4'), getVal('blue_p5')],
                    bans: [getVal('blue_ban1'), getVal('blue_ban2'), getVal('blue_ban3'), getVal('blue_ban4'), getVal('blue_ban5')],
                    picks: [getVal('blue_pick1'), getVal('blue_pick2'), getVal('blue_pick3'), getVal('blue_pick4'), getVal('blue_pick5')]
                },
                red: {
                    name: getVal('red_name'), logo: redLogoBase64,
                    players: [getVal('red_p1'), getVal('red_p2'), getVal('red_p3'), getVal('red_p4'), getVal('red_p5')],
                    bans: [getVal('red_ban1'), getVal('red_ban2'), getVal('red_ban3'), getVal('red_ban4'), getVal('red_ban5')],
                    picks: [getVal('red_pick1'), getVal('red_pick2'), getVal('red_pick3'), getVal('red_pick4'), getVal('red_pick5')]
                },
                timestamp: Date.now()
            };
            localStorage.setItem('mlbb_draft_data', JSON.stringify(draftData));
        }

        // SYSTEM STRICT CUSTOM SEARCH DROPDOWN
        document.addEventListener("DOMContentLoaded", () => {
            // Pasang pendengar ke input text biasa (Nama tim & Player)
            const standardInputs = document.querySelectorAll('input[type="text"]:not(.hero-input)');
            standardInputs.forEach(input => input.addEventListener('input', syncDraft));

            // Buat Dropdown dinamis untuk setiap kolom Hero
            const heroInputs = document.querySelectorAll('.hero-input');
            heroInputs.forEach(input => {
                const container = input.parentElement;
                
                // Buat menu dropdown div di bawah input
                const menu = document.createElement('div');
                menu.className = 'dropdown-menu';
                container.appendChild(menu);

                const filterHero = () => {
                    const query = input.value.toLowerCase().trim();
                    menu.innerHTML = '';

                    // Jika kosong, sembunyikan dropdown menu
                    if (query === '') {
                        menu.style.display = 'none';
                        return;
                    }

                    // STRICT FILTER: Hanya cari hero yang mirip/mengandung text pencarian
                    const matches = mlbbHeroes.filter(hero => hero.toLowerCase().includes(query));

                    if (matches.length === 0) {
                        const noMatch = document.createElement('div');
                        noMatch.className = 'dropdown-item';
                        noMatch.style.color = '#888';
                        noMatch.innerText = 'Hero tidak ditemukan';
                        menu.appendChild(noMatch);
                    } else {
                        matches.forEach(heroName => {
                            const item = document.createElement('div');
                            item.className = 'dropdown-item';
                            item.innerText = heroName;

                            // Kejadian saat item dropdown di-klik / di-tap
                            item.addEventListener('mousedown', (e) => {
                                e.preventDefault(); // Cegah blur trigger duluan
                                input.value = heroName;
                                menu.style.display = 'none';
                                syncDraft(); // Lempar data langsung ke overlay
                            });

                            menu.appendChild(item);
                        });
                    }
                    menu.style.display = 'block';
                };

                // Pemicu filter saat mengetik atau saat kolom fokus kembali
                input.addEventListener('input', filterHero);
                input.addEventListener('focus', filterHero);

                // Sembunyikan jika operator berpindah input
                input.addEventListener('blur', () => {
                    setTimeout(() => { menu.style.display = 'none'; }, 200);
                });
            });

            // Kirim data default awal ke overlay
            syncDraft();
        });
    </script>
</body>
</html>
