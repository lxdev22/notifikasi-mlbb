<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBS Overlay</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: transparent; /* Wajib transparan untuk OBS */
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #overlay-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        video {
            display: none; /* Sembunyikan video jika sedang tidak diputar */
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <div id="overlay-container">
        <video id="alert-video" autoplay></video>
    </div>

<script>
    const bc = new BroadcastChannel('obs_alerts');
    const videoElement = document.getElementById('alert-video');

    // Menerima perintah dari Control Panel
    bc.onmessage = (event) => {
        if (event.data.action === 'play') {
            playAlert(event.data.type);
        }
    };

    function playAlert(type) {
        // 1. Reset video jika alert sebelumnya masih berputar
        videoElement.pause();
        videoElement.currentTime = 0;
        
        // 2. Ganti sumber file video .mp4 sesuai tombol
        videoElement.src = `${type}.mp4`;
        
        // 3. Tampilkan elemen video di layar
        videoElement.style.display = 'block';
        
        // 4. Muat ulang dan paksa putar (Auto-play)
        videoElement.load();
        
        const playPromise = videoElement.play();
        if (playPromise !== undefined) {
            playPromise.catch(error => {
                console.log("Autoplay diblokir oleh sistem browser:", error);
                // Catatan: Di dalam OBS Studio, error ini jarang terjadi karena OBS mengizinkan autoplay secara default.
            });
        }
    }

    // Ketika video selesai diputar, sembunyikan kembali agar overlay transparan lagi
    videoElement.onended = () => {
        videoElement.style.display = 'none';
        videoElement.src = ''; // Kosongkan source untuk menghemat RAM
    };
</script>

</body>
</html>
